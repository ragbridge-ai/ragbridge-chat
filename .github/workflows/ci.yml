name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ragbridge_chat:ragbridge_chat@localhost:5432/ragbridge_chat
    services:
      # The gateway's own database holds no vectors, so plain PostgreSQL is enough.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ragbridge_chat
          POSTGRES_PASSWORD: ragbridge_chat
          POSTGRES_DB: ragbridge_chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragbridge_chat -d ragbridge_chat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest
